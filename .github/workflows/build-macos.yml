name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check music_app tests tools soundcloud_gui.py soundcloud_downloader.py
      - run: python -m mypy music_app --ignore-missing-imports
      - run: python -m pytest -m "not network"
      - run: python tools/build_pyinstaller.py SoundCloudMusic.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: SoundCloudMusic-macOS-arm64
          path: dist/SoundCloudMusic-macOS-arm64.zip
          retention-days: 30
      - name: Attach tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "SoundCloud Music $tag" --generate-notes
          gh release upload "$tag" dist/SoundCloudMusic-macOS-arm64.zip --clobber
